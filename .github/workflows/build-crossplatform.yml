# GitHub Actions Workflow for Building Windows & Linux x86_64 Audio Plugin Binaries
name: Cross-Platform Builds (Windows & Linux x86_64)

on:
  workflow_dispatch:
    inputs:
      verify_run:
        description: Verify an existing Windows build artifact without rebuilding
        required: false
        default: ""
        type: string
  push:
    tags: ["v*"]
    branches: [main]

permissions:
  contents: write

jobs:
  # -------------------------------------------------------------
  # Linux x86_64 Build (VST3, CLAP, LV2, Standalone)
  # -------------------------------------------------------------
  linux:
    if: ${{ inputs.verify_run == '' }}
    name: Linux x86_64 (HybridEQ)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config \
            libasound2-dev libjack-jackd2-dev libx11-dev libxi-dev \
            libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxrender-dev libfreetype-dev libfontconfig1-dev \
            libgl1-mesa-dev xvfb

      - name: Configure CMake
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DHYBRIDEQ_BUILD_TESTS=ON

      - name: Build plugin formats
        run: |
          cmake --build build --parallel 2 \
            --target HybridEQSpectrumTest \
                     HybridEQ_VST3 \
                     HybridEQ_CLAP \
                     HybridEQ_LV2 \
                     HybridEQ_Standalone

      - name: Verify rendering and build current manual
        run: |
          mkdir -p qa-render
          xvfb-run -a build/HybridEQSpectrumTest_artefacts/Release/HybridEQSpectrumTest "$PWD/qa-render" | tee qa-render/results.txt
          python3 -m pip install reportlab
          python3 tools/build_user_manual.py

      - name: Package Linux assets
        run: |
          VERSION=$(cat VERSION)
          PKG_NAME="HybridEQ-${VERSION}-linux-x86_64"
          mkdir -p "dist/${PKG_NAME}/plugins" "dist/${PKG_NAME}/Documentation"
          for format in VST3 CLAP LV2; do
            test -d "build/HybridEQ_artefacts/Release/$format"
            cp -R "build/HybridEQ_artefacts/Release/$format" "dist/${PKG_NAME}/plugins/"
          done
          cp LICENSE BINARY_LICENSE.txt THIRD_PARTY_NOTICES.txt README.md RELEASE_NOTES.md "dist/${PKG_NAME}/"
          cp -R Licenses "dist/${PKG_NAME}/"
          cp output/pdf/HybridEQ-User-Manual.pdf Docs/UserManual.md "dist/${PKG_NAME}/Documentation/"
          tar -C dist -czf "dist/${PKG_NAME}.tar.gz" "${PKG_NAME}"
          (cd dist && sha256sum "${PKG_NAME}.tar.gz" > "${PKG_NAME}.tar.gz.sha256")

      - name: Upload linux rendering evidence
        uses: actions/upload-artifact@v4
        with:
          name: HybridEQ-linux-render-checks
          path: qa-render/

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HybridEQ-linux-x86_64
          path: dist/*-linux-x86_64.tar.gz*

      - name: Attach to GitHub Release (Tag push only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/*-linux-x86_64.tar.gz
            dist/*-linux-x86_64.tar.gz.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # -------------------------------------------------------------
  # Windows x86_64 Build (VST3, CLAP, LV2, Standalone)
  # -------------------------------------------------------------
  windows:
    if: ${{ inputs.verify_run == '' }}
    name: Windows x86_64 (HybridEQ)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC environment & Ninja
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Ninja
        run: |
          python -m pip install ninja
          if ($LASTEXITCODE -ne 0) { throw "Ninja installation failed" }
          ninja --version

      - name: Configure CMake
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_CXX_FLAGS="/D_USE_MATH_DEFINES" `
            -DHYBRIDEQ_BUILD_TESTS=ON

      - name: Build plugin formats
        run: |
          cmake --build build --config Release --parallel 2 `
            --target HybridEQSpectrumTest `
                     HybridEQ_VST3 `
                     HybridEQ_CLAP `
                     HybridEQ_LV2 `
                     HybridEQ_Standalone

      - name: Verify rendering and build current manual
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force qa-render | Out-Null
          & build/HybridEQSpectrumTest_artefacts/Release/HybridEQSpectrumTest.exe "$PWD/qa-render" | Tee-Object qa-render/results.txt
          if ($LASTEXITCODE -ne 0) { throw "Rendering regression failed" }
          python -m pip install reportlab
          if ($LASTEXITCODE -ne 0) { throw "Documentation dependency failed" }
          python tools/build_user_manual.py
          if ($LASTEXITCODE -ne 0) { throw "Manual build failed" }

      - name: Package Windows assets
        shell: pwsh
        run: |
          $ver = (Get-Content VERSION).Trim()
          New-Item -ItemType Directory -Force resources/Licenses, resources/Manual | Out-Null
          Copy-Item LICENSE, BINARY_LICENSE.txt, THIRD_PARTY_NOTICES.txt resources/Licenses/
          Copy-Item third_party/GoodLookinUI/LICENSE resources/Licenses/GoodLookinUI-LICENSE.txt
          Copy-Item -Recurse Licenses/third-party resources/Licenses/
          Copy-Item README.md, RELEASE_NOTES.md resources/
          Copy-Item output/pdf/HybridEQ-User-Manual.pdf, Docs/UserManual.md resources/Manual/
          & tools/make_bundle_zip.ps1 -Plugin HybridEQ -Version $ver -Artefacts build/HybridEQ_artefacts/Release -Out dist -ResourcesDir resources
          $zip = "HybridEQ-$ver-windows-x64-bundles.zip"
          & tests/verify_windows_bundle.ps1 -Archive "dist/$zip"
          $hash = (Get-FileHash -Algorithm SHA256 "dist/$zip").Hash.ToLowerInvariant()
          "$hash  $zip" | Set-Content -Encoding ascii "dist/$zip.sha256"

      - name: Upload windows rendering evidence
        uses: actions/upload-artifact@v4
        with:
          name: HybridEQ-windows-render-checks
          path: qa-render/

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HybridEQ-windows-x86_64
          path: dist/*-windows-x64-bundles.zip*

      - name: Attach to GitHub Release (Tag push only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/*-windows-x64-bundles.zip
            dist/*-windows-x64-bundles.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows-install-layout:
    if: ${{ inputs.verify_run != '' }}
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: HybridEQ-windows-x86_64
          run-id: ${{ inputs.verify_run }}
          github-token: ${{ github.token }}
          path: downloaded
      - name: Verify real archive installation and update paths
        shell: pwsh
        run: |
          $archive = @(Get-ChildItem downloaded -Filter '*-windows-x64-bundles.zip')
          if ($archive.Count -ne 1) { throw "Expected exactly one Windows bundle archive" }
          & tests/verify_windows_bundle.ps1 -Archive $archive[0].FullName
