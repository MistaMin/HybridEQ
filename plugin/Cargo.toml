[package]
name = "hybrideq"
version = "2.0.1"
edition = "2021"
license = "MIT"
rust-version = "1.85"
description = "HybridEQ: console EQ and preamp circuits on OpenPluginSDK."
publish = false

[lib]
name = "hybrideq"
crate-type = ["cdylib", "staticlib", "rlib"]

# OpenPluginSDK is located at build time: scripts/sdk_env.sh writes the untracked
# .cargo/config.toml that patches this dependency to a local checkout.
[dependencies]
hybrideq-engine = { path = "../crates/engine" }
openplugin = "1.0.0-beta"

[dev-dependencies]
openplugin = { version = "1.0.0-beta", features = ["testing"] }

[[bin]]
name = "hybrideq-lv2-ttl"
path = "src/bin/lv2_ttl.rs"

[[bin]]
name = "hybrideq-preview"
path = "src/bin/preview.rs"

[profile.release]
codegen-units = 1
lto = "thin"
debug = false

[workspace]
